name: Mac build and regression
on:
  push:
    branches: [main, codex/macos-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -X utf8 -m unittest discover -s tests -v
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-macos.txt
      - name: Shared authentication and engine tests
        run: python -m unittest discover -s tests -p 'test_portal.py' -v && python -m unittest discover -s tests -p 'test_engine.py' -v && python -m unittest discover -s tests -p 'test_network_storage.py' -v
      - name: Mac logic and native integration
        timeout-minutes: 4
        run: python -u -m unittest discover -s tests/macos -v
      - name: Build app and distributions
        run: python tools/package_macos.py
      - name: Packaged UI smoke test
        run: python tools/check_macos_app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.os }}
          path: |
            build/macos-release/*
            build/macos-app-report.json
            build/macos-window.png
            build/macos-consent.txt
          if-no-files-found: warn
